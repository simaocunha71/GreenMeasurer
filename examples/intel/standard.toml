# Run from the repository root; see examples/README.md for dependencies and adaptation.
[measurement]
mode = "standard"
calibration_file = "example-intel-temperature-baseline.txt"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 30"
language = "Python"
program = "fibonacci-30"
output = "example-intel-standard.csv"
repetitions = 1

[[device]]
name = "IntelCPU"
lib = "../../src/devices/libgm_intel_cpu.a"
header = "../../src/devices/linux/cpu/intel/intel_cpu.h"
link = ["-L/usr/local/lib", "-lraplcap-powercap", "-lpowercap", "-lsensors"]
setup = "int intel_cpu_begin()"
teardown = "void intel_cpu_end()"

[[device.metric]]
name = "Package"
read = "double intel_cpu_get_package()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Core"
read = "double intel_cpu_get_core()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "DRAM"
read = "double intel_cpu_get_dram()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Temperature"
read = "double intel_cpu_get_temperature()"
kind = "gauge"
unit = "C"

[[device]]
name = "IntelGPU"
optional = true
lib = "../../src/devices/libgm_intel_gpu.a"
header = "../../src/devices/linux/gpu/intel/intel_gpu.h"
setup = "int intel_gpu_begin()"
teardown = "void intel_gpu_end()"

[[device.metric]]
name = "Energy"
read = "double intel_gpu_get_energy()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Temperature"
read = "double intel_gpu_get_temperature()"
kind = "gauge"
unit = "C"
