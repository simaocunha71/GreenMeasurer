# Run from the repository root; see examples/README.md for dependencies and adaptation.
[measurement]
mode = "over-time"
calibration_file = "example-system-temperature-baseline.txt"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 30"
language = "Python"
program = "fibonacci-30"
output = "example-system-overtime.csv"
repetitions = 1
interval_ms = 10

[[aspect]]
name = "System"
lib = "../../src/devices/libgm_system.a"
header = "../../src/devices/linux/system.h"

[[aspect.metric]]
name = "Cores"
read = "double system_get_core_count()"
kind = "gauge"
unit = "cores"

[[aspect.metric]]
name = "CoreFrequency"
read = "double system_get_core_frequency_mhz()"
kind = "gauge"
unit = "MHz"

[[aspect.metric]]
name = "RunningProcesses"
read = "double system_get_running_processes()"
kind = "gauge"
unit = "processes"

[[aspect.metric]]
name = "WorkloadProcesses"
read = "double system_get_workload_processes()"
kind = "gauge"
unit = "processes"

[[aspect.metric]]
name = "WorkloadMemory"
read = "double system_get_workload_memory_kb()"
kind = "gauge"
unit = "KiB"
