# This changes CPU power limits. Adjust the range to your hardware before running.
[measurement]
mode = "powercap-calibration"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 30"
language = "Python"
program = "fibonacci-30"
output = "example-powercap-calibration.csv"
repetitions = 1
powercap_min = 5
powercap_max = 5
calibration_file = "example-temperature-baseline.txt"

[[device]]
name = "IntelCPU"
lib = "../src/devices/libgm_intel_cpu.a"
header = "../src/devices/linux/cpu/intel/intel_cpu.h"
link = ["-L/usr/local/lib", "-lraplcap-powercap", "-lpowercap", "-lsensors"]
setup = "int intel_cpu_begin()"
teardown = "void intel_cpu_end()"
thermal = "double intel_cpu_get_temperature()"
powercap_calibration = "intel_cpu_calibrate_powercap"

[[device.metric]]
name = "Package"
read = "double intel_cpu_get_package()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Core"
read = "double intel_cpu_get_core()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "DRAM"
read = "double intel_cpu_get_dram()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Temperature"
read = "double intel_cpu_get_temperature()"
kind = "gauge"
unit = "C"

[[device]]
name = "IntelGPU"
optional = true
lib = "../src/devices/libgm_intel_gpu.a"
header = "../src/devices/linux/gpu/intel/intel_gpu.h"
setup = "int intel_gpu_begin()"
teardown = "void intel_gpu_end()"

[[device.metric]]
name = "Energy"
read = "double intel_gpu_get_energy()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Temperature"
read = "double intel_gpu_get_temperature()"
kind = "gauge"
unit = "C"

[[device]]
name = "NvidiaGPU"
optional = true
lib = "../src/devices/libgm_nvidia_gpu.a"
header = "../src/devices/linux/gpu/nvidia/nvidia_gpu.h"
link = ["-lnvidia-ml"]
setup = "int nvidia_begin()"
teardown = "void nvidia_end()"

[[device.metric]]
name = "Energy"
read = "double nvidia_get_energy()"
kind = "counter"
unit = "J"

[[device.metric]]
name = "Power"
read = "double nvidia_get_power()"
kind = "gauge"
unit = "W"

[[device.metric]]
name = "Temperature"
read = "double nvidia_get_temperature()"
kind = "gauge"
unit = "C"

[[device.metric]]
name = "Utilization"
read = "double nvidia_get_utilization()"
kind = "gauge"
unit = "%"

[[device.metric]]
name = "VRAM"
read = "double nvidia_get_vram()"
kind = "gauge"
unit = "MiB"

[[device]]
name = "System"
lib = "../src/devices/libgm_system.a"
header = "../src/devices/linux/system.h"

[[device.metric]]
name = "Cores"
read = "double system_get_core_count()"
kind = "gauge"
unit = "cores"

[[device.metric]]
name = "CoreFrequency"
read = "double system_get_core_frequency_mhz()"
kind = "gauge"
unit = "MHz"

[[device.metric]]
name = "RunningProcesses"
read = "double system_get_running_processes()"
kind = "gauge"
unit = "processes"

[[device.metric]]
name = "WorkloadProcesses"
read = "double system_get_workload_processes()"
kind = "gauge"
unit = "processes"

[[device.metric]]
name = "WorkloadMemory"
read = "double system_get_workload_memory_kb()"
kind = "gauge"
unit = "KiB"
