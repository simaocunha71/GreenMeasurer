# Intel CPU supplies temperature and powercap calibration.
# This mode records a temperature baseline; it does not run Fibonacci.
[measurement]
mode = "temperature-calibration"
sleep_seconds = 1
calibration_file = "example-nvidia-temperature-baseline.txt"

[[aspect]]
name = "IntelCPU"
lib = "../../src/devices/libgm_intel_cpu.a"
header = "../../src/devices/linux/cpu/intel/intel_cpu.h"
link = ["-L/usr/local/lib", "-lraplcap-powercap", "-lpowercap", "-lsensors"]
setup = "int intel_cpu_begin()"
teardown = "void intel_cpu_end()"
thermal = "double intel_cpu_get_temperature()"

[[aspect.metric]]
name = "Temperature"
read = "double intel_cpu_get_temperature()"
kind = "gauge"
unit = "C"
