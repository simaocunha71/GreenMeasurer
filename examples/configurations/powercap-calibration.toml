[measurement]
mode = "powercap-calibration"
command = "python3 Utils/fibonacci.py 34"
language = "Python"
program = "fibonacci_34"
powercap_min = 5
powercap_max = 15
variance = 5
timeout_hours = 1
repetitions = 3
sleep_seconds = 3
calibration_file = "/tmp/cores_temperatures.txt"
output = "powercap_calibration.csv"
