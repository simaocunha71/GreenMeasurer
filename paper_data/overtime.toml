[measurement]
mode = "over-time"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 42"
language = "Python"
program = "fibonacci-42"
output = "paper_data/overtime.csv"
interval_us = 10000
sleep_seconds = 60
variance = 5
powercap = [-1, 5]
calibration_file = "paper_data/temperature-baseline.txt"

[metrics]
select = "all"
