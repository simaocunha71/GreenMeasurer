[measurement]
mode = "powercap-calibration"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 42"
language = "Python"
program = "fibonacci-42"
output = "paper_data/powercap-calibration.csv"
repetitions = 10
timeout_hours = 4
sleep_seconds = 60
variance = 5
powercap_min = 1
powercap_max = 25
calibration_file = "paper_data/temperature-baseline.txt"

[metrics]
select = "all"
