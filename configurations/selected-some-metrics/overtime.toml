[measurement]
mode = "over-time"
command = 'python3 -c "sum(i*i for i in range(15000000))"'
language = "Python"
program = "cpu-workload"
output = "greenmeasurer-test-overtime.csv"
interval_ms = 10
sleep_seconds = 0
variance = 5
powercap = -1
calibration_file = "greenmeasurer-test-temperature.txt"

[metrics]
select = ["system.cores", "cpu.Package", "cpu.Temperature"]
