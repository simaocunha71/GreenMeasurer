[measurement]
mode = "powercap-calibration"
command = 'python3 -c "sum(i*i for i in range(5000000))"'
language = "Python"
program = "cpu-workload"
powercap_min = 15
powercap_max = 16
repetitions = 3
timeout_hours = 1
variance = 5
sleep_seconds = 0
calibration_file = "greenmeasurer-test-temperature.txt"
output = "greenmeasurer-test-powercap-calibration.csv"
