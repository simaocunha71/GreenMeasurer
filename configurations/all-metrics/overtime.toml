[measurement]
mode = "overtime"
command = 'python3 -c "sum(i*i for i in range(15000000))"'
language = "Python"
program = "cpu-workload"
output = "greenmeasurer-all-metrics-overtime.csv"
interval_us = 10000
sleep_seconds = 0
variance = 5
powercap = -1
calibration_file = "greenmeasurer-test-temperature.txt"

[metrics]
select = "all"
