[[aspect]]
name = "Cpu.Package"
lib = "libtoy.a"
header = "toy.h"
read = "unsigned long toy_energy()"
kind = "counter"
unit = "uJ"

[[aspect]]
name = "Cpu.Powercap"
lib = "libtoy.a"
header = "toy.h"
powercap_set = "int toy_cap_set(int)"
powercap_restore = "int toy_cap_restore()"
powercap_calibration = "toy_calibrate"

[[aspect]]
name = "Cpu.Temperature"
lib = "libtoy.a"
header = "toy.h"
read = "double toy_thermal()"
unit = "C"
thermal = true
