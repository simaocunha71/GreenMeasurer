[measurement]
aspect = "Cpu"
mode = "over-time"

[device]
lib = "libtoy.a"
header = "toy.h"

[[metric]]
name = "Cpu.Package"
measurement = "unsigned long toy_energy()"
kind = "counter"
unit = "uJ"

[[metric]]
name = "Cpu.Temperature"
measurement = "double toy_thermal()"
unit = "C"
thermal = true
calibration = "double toy_calibrate_thermal(unsigned)"
