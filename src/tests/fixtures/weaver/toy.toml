[[aspect]]
name = "Energy.Package"
lib = "libtoy.a"
header = "toy.h"
setup = "int toy_setup()"
teardown = "void toy_teardown()"
read = "unsigned long toy_energy()"
kind = "counter"
unit = "uJ"

[[aspect]]
name = "Energy.Gauge"
lib = "libtoy.a"
header = "toy.h"
setup = "int toy_setup()"
teardown = "void toy_teardown()"
read = "float toy_temperature()"
unit = "C"

[[aspect]]
name = "Processes.NumberProcesses"
lib = "libtoy.a"
header = "toy.h"
read = "int toy_processes()"
