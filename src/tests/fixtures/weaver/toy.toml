[measurement]
mode = "over-time"
command = "sleep 0.3"
language = "Shell"
program = "sleep"
output = "toy.csv"
interval_ms = 10

[[device]]
name = "Energy"
lib = "libtoy.a"
header = "toy.h"
setup = "int toy_setup()"
teardown = "void toy_teardown()"

[[device.metric]]
name = "Package"
read = "unsigned long toy_energy()"
kind = "counter"
unit = "uJ"

[[device.metric]]
name = "Temperature"
read = "float toy_temperature()"
unit = "C"

[[device]]
name = "Processes"
lib = "libtoy.a"
header = "toy.h"

[[device.metric]]
name = "NumberProcesses"
read = "int toy_processes()"
