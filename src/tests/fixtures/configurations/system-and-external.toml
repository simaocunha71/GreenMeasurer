[measurement]
mode = "over-time"
command = "sleep 1"
language = "Shell"
program = "system-and-external"
interval_us = 10000
sleep_seconds = 0
output = "system-and-external.csv"

[metrics]
select = ["system.cores", "system.running_processes", "external.processes.RunningProcesses"]

[[adapters]]
name = "processes"
path = "../custom_metric/adapter.so"
