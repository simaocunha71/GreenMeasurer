[measurement]
mode = "standard"
command = "sleep 1"
language = "Shell"
program = "example"
output = "standard-system-and-external.csv"
repetitions = 2
timeout_hours = 1
sleep_seconds = 0

[metrics]
select = ["system.cores", "external.processes.RunningProcesses"]

[[adapters]]
name = "processes"
path = "../custom_metric/adapter.so"
