# Wait for the CPU to stabilize before recording its temperature baseline.
# Run from the repository root with the permissions required by the device.
#   python3 scripts/weave.py configurations-generated/fibonacci-python-temperature-calibration.toml
#   configurations-generated/generated-fibonacci-python-temperature-calibration/greenmeasurer

[measurement]
mode = "temperature-calibration"
sleep_seconds = 60
calibration_file = "cores_temperatures.txt"

[[aspect]]
name = "IntelCPU"
lib = "../src/devices/libgm_intel_cpu.a"
header = "../src/devices/linux/cpu/intel/intel_cpu.h"
link = ["-L/usr/local/lib", "-lraplcap-powercap", "-lpowercap", "-lsensors"]
setup = "int intel_cpu_begin()"
teardown = "void intel_cpu_end()"
thermal = "double intel_cpu_get_temperature()"

[[aspect.metric]]
name = "Temperature"
read = "double intel_cpu_get_temperature()"
unit = "C"
