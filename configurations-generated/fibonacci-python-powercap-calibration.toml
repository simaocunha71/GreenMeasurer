# Powercap calibration: CPU Package, Core and DRAM, NVIDIA GPU energy and temperature,
# and Intel GPU energy. Run from the repository root with sudo (RAPL MSR).
# The executable tests the saved baseline (-1), then each limit from 5 to 15 W
# in 1 W steps, and processes the resulting CSV.
#   python3 scripts/weave.py configurations-generated/fibonacci-python-powercap-calibration.toml
#   sudo configurations-generated/generated-fibonacci-python-powercap-calibration/greenmeasurer

[measurement]
mode = "powercap-calibration"
calibration_file = "cores_temperatures.txt"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 42"
language = "Python"
program = "fibonacci-42"
output = "fibonacci-python-powercap-calibration.csv"
powercap_min = 5
powercap_max = 15
repetitions = 10
sleep_seconds = 60
variance = 5

[[aspect]]
name = "IntelCPU"
lib = "../src/devices/libgm_intel_cpu.a"
header = "../src/devices/linux/cpu/intel/intel_cpu.h"
link = ["-L/usr/local/lib", "-lraplcap-powercap", "-lpowercap", "-lsensors"]
setup = "int intel_cpu_begin()"
teardown = "void intel_cpu_end()"
thermal = "double intel_cpu_get_temperature()"
powercap_set = "int intel_cpu_set_powercap(int)"
powercap_restore = "int intel_cpu_destroy_powercap()"
powercap_calibration = "intel_cpu_calibrate_powercap"

[[aspect.metric]]
name = "Package"
read = "double intel_cpu_get_package()"
kind = "counter"
unit = "J"

[[aspect.metric]]
name = "Core"
read = "double intel_cpu_get_core()"
kind = "counter"
unit = "J"

[[aspect.metric]]
name = "DRAM"
read = "double intel_cpu_get_dram()"
kind = "counter"
unit = "J"

[[aspect]]
name = "IntelGPU"
optional = true
lib = "../src/devices/libgm_intel_gpu.a"
header = "../src/devices/linux/gpu/intel/intel_gpu.h"
setup = "int intel_gpu_begin()"
teardown = "void intel_gpu_end()"

[[aspect.metric]]
name = "Energy"
read = "double intel_gpu_get_energy()"
kind = "counter"
unit = "J"

[[aspect]]
name = "NvidiaGPU"
optional = true
lib = "../src/devices/libgm_nvidia_gpu.a"
header = "../src/devices/linux/gpu/nvidia/nvidia_gpu.h"
link = ["-lnvidia-ml"]
setup = "int nvidia_begin()"
teardown = "void nvidia_end()"

[[aspect.metric]]
name = "Energy"
read = "double nvidia_get_energy()"
kind = "counter"
unit = "J"

[[aspect.metric]]
name = "Temperature"
read = "double nvidia_get_temperature()"
kind = "gauge"
unit = "C"
