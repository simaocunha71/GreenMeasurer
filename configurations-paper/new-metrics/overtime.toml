# A metric GreenMeasurer does not provide: the user supplies the C function
# (system_uptime.c / system_uptime.h) and GreenMeasurer builds a .so for it.
[measurement]
mode = "overtime"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 42"
language = "Python"
program = "fibonacci-42"
output = "greenmeasurer-new-metric-overtime.csv"
sleep_seconds = 60
interval_us = 10000
variance = 5
powercap = -1
calibration_file = "greenmeasurer-test-temperature.txt"

[metrics]
select = ["system.cores", "cpu.Package", "external.system.UptimeSeconds"]

[[external_metrics]]
name = "system"
metric = "UptimeSeconds"
unit = "s"
function = "get_system_uptime_seconds"
header = "system_uptime.h"
sources = ["system_uptime.c"]
return_type = "double"
arguments = []
error_value = -1
