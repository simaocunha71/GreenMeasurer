[measurement]
mode = "over-time"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 42"
language = "Python"
program = "fibonacci-42"
output = "paper-overtime.csv"
interval_ms = 1
sleep_seconds = 60
variance = 5
powercap = [-1, 5, 10]
calibration_file = "paper-temperature-baseline.txt"

[metrics]
select = "all"
