[measurement]
mode = "powercap-calibration"
command = "python3 Languages/Python/Fibonacci/fibonacci.py 42"
language = "Python"
program = "fibonacci-42"
output = "paper-powercap-calibration.csv"
powercap_min = 1
powercap_max = 3
repetitions = 3
timeout_hours = 4
variance = 25
sleep_seconds = 5
calibration_file = "paper-temperature-baseline.txt"

[metrics]
select = "all"
